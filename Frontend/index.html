<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Assist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --plum: #601D49;
    --rose: #BD5579;
    --blush: #EA9D9D;
    --cream: #FFEBB8;
    --bg: #FAF6EE;
    --surface: #FFFFFF;
    --text: #2A1420;
    --text-soft: #7A5A6C;
    --border: #EADCC8;
    --restricted-bg: #F3ECEF;
    --restricted-border: #D8C3CC;
  }

  :root[data-theme="dark"] {
    --plum: #A9527E;
    --rose: #D9799A;
    --blush: #EA9D9D;
    --cream: #FFEBB8;
    --bg: #331D2C;
    --surface: #3F2E3E;
    --text: #F3E9EE;
    --text-soft: #A78295;
    --border: #4E3A48;
    --restricted-bg: #3A2A34;
    --restricted-border: #5A4552;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --plum: #A9527E;
      --rose: #D9799A;
      --blush: #EA9D9D;
      --cream: #FFEBB8;
      --bg: #331D2C;
      --surface: #3F2E3E;
      --text: #F3E9EE;
      --text-soft: #A78295;
      --border: #4E3A48;
      --restricted-bg: #3A2A34;
      --restricted-border: #5A4552;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.3s ease, color 0.3s ease;
  }

  header {
    padding: 20px 24px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--plum), var(--rose));
    flex-shrink: 0;
  }

  .brand-text h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .brand-text p {
    margin: 0;
    font-size: 12px;
    color: var(--text-soft);
  }

  .theme-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }

  .theme-toggle:active { transform: scale(0.92); }

  main {
    flex: 1;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 16px 140px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .msg-row {
    display: flex;
    gap: 10px;
    max-width: 88%;
    animation: rise 0.28s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.student {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-row.system { align-self: flex-start; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: white;
  }

  .student .avatar { background: var(--rose); }
  .system .avatar { background: var(--plum); }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
  }

  .student .bubble {
    background: var(--rose);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .system .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .result-card {
    margin-top: 2px;
    border-radius: 14px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    font-size: 14px;
  }

  .result-card.restricted {
    background: var(--restricted-bg);
    border-color: var(--restricted-border);
  }

  .result-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 8px;
    color: var(--plum);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  :root[data-theme="dark"] .result-title,
  @media (prefers-color-scheme: dark) { .result-title { color: var(--blush); } }

  .result-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    row-gap: 6px;
    column-gap: 14px;
  }

  .result-grid dt {
    color: var(--text-soft);
    font-weight: 500;
  }

  .result-grid dd {
    margin: 0;
    font-weight: 500;
  }

  .priority-pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    color: white;
  }

  .priority-low { background: #8FAE8B; }
  .priority-medium { background: #D9A441; }
  .priority-high { background: #D9714A; }
  .priority-critical { background: #B23A3A; }

  .restricted-note {
    color: var(--text-soft);
    font-size: 13.5px;
    line-height: 1.5;
  }

  .composer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  }

  .composer-inner {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 14px;
    padding: 12px 14px;
    font-family: 'Poppins', sans-serif;
    font-size: 14.5px;
    line-height: 1.4;
    max-height: 120px;
    outline: none;
  }

  textarea:focus {
    border-color: var(--rose);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--rose) 22%, transparent);
  }

  .send-btn {
    background: var(--plum);
    color: white;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 17px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .send-btn:hover { background: var(--rose); }
  .send-btn:active { transform: scale(0.94); }
  .send-btn:disabled { opacity: 0.5; cursor: default; }
  .send-btn:focus-visible, textarea:focus-visible, .theme-toggle:focus-visible {
    outline: 2px solid var(--rose);
    outline-offset: 2px;
  }

  .hint {
    text-align: center;
    color: var(--text-soft);
    font-size: 12px;
    margin-top: 8px;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 16px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-soft);
    animation: bounce 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .error-note {
    color: #B23A3A;
    font-size: 13.5px;
  }

  .draft-card {
    margin-top: 2px;
    border-radius: 14px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px dashed var(--rose);
    border-bottom-left-radius: 4px;
    font-size: 14px;
  }

  .draft-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 8px;
    color: var(--rose);
    text-transform: none;
  }

  .location-ask {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .location-ask p {
    margin: 0 0 8px;
    font-size: 13.5px;
    color: var(--text-soft);
  }

  .location-ask-row {
    display: flex;
    gap: 8px;
  }

  .location-ask-row input {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 10px;
    font-family: 'Poppins', sans-serif;
    font-size: 13.5px;
    outline: none;
  }

  .location-ask-row input:focus {
    border-color: var(--rose);
  }

  .location-ask-row button {
    background: var(--plum);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 14px;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }

  .location-ask-row button:hover { background: var(--rose); }

  .draft-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .draft-actions button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 9px 0;
    font-family: 'Poppins', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }

  .draft-actions button:active { transform: scale(0.97); }
  .draft-actions button:disabled { opacity: 0.5; cursor: default; }

  .btn-confirm {
    background: var(--plum);
    color: white;
  }

  .btn-confirm:hover:not(:disabled) { background: var(--rose); }

  .btn-edit {
    background: transparent;
    border: 1px solid var(--border) !important;
    color: var(--text-soft);
  }

  .btn-edit:hover { border-color: var(--rose) !important; color: var(--rose); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">
      <h1>Campus Assist</h1>
      <p>Tell us what's going on — we'll route it for you</p>
    </div>
  </div>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
</header>

<main id="thread">
  <div class="msg-row system">
    <div class="avatar">CA</div>
    <div class="bubble">
      Hi — describe what's happening, in your own words. If it's something urgent or sensitive, that's okay too; those go to a confidential queue automatically.
    </div>
  </div>
</main>

<div class="composer">
  <div class="composer-inner">
    <textarea id="input" rows="1" placeholder="Describe the issue..." aria-label="Describe your grievance"></textarea>
    <button class="send-btn" id="sendBtn" aria-label="Send">➤</button>
  </div>
  <p class="hint">Runs against your local server at 127.0.0.1:8000</p>
</div>

<script>
  const CLASSIFY_URL = "http://127.0.0.1:8000/api/complaints/classify";
  const SUBMIT_URL = "http://127.0.0.1:8000/api/complaints/submit";

  const thread = document.getElementById('thread');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const themeToggle = document.getElementById('themeToggle');

  // Holds the description currently being drafted, so an "add location"
  // reply or an Edit action knows what it's amending.
  let pendingDescription = null;

  // Theme toggle — per-viewer convenience only, no persistence needed
  let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    themeToggle.textContent = isDark ? '☀️' : '🌙';
  }
  applyTheme();
  themeToggle.addEventListener('click', () => {
    isDark = !isDark;
    applyTheme();
  });

  // Auto-grow textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  sendBtn.addEventListener('click', handleSend);

  function scrollToBottom() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function addStudentMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row student';
    row.innerHTML = `
      <div class="avatar">You</div>
      <div class="bubble"></div>
    `;
    row.querySelector('.bubble').textContent = text;
    thread.appendChild(row);
    scrollToBottom();
  }

  function addTypingIndicator() {
    const row = document.createElement('div');
    row.className = 'msg-row system';
    row.id = 'typingRow';
    row.innerHTML = `
      <div class="avatar">CA</div>
      <div class="bubble typing"><span></span><span></span><span></span></div>
    `;
    thread.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function priorityClass(priority) {
    if (!priority) return '';
    return 'priority-' + priority.toLowerCase();
  }

  function locationSummary(loc) {
    if (!loc) return 'Not detected';
    const parts = [loc.building, loc.floor, loc.area, loc.specific].filter(Boolean);
    return parts.length ? parts.join(' — ') : 'Not detected';
  }

  function addFinalResult(data) {
    const row = document.createElement('div');
    row.className = 'msg-row system';

    if (data.restricted) {
      row.innerHTML = `
        <div class="avatar">CA</div>
        <div class="result-card restricted">
          <div class="result-title">🔒 Sent to the confidential queue</div>
          <p class="restricted-note">
            This has been routed directly to Student Affairs and won't appear on any public dashboard.
            Someone from that team will follow up. Reference #${data.reference_number ?? ''}.
          </p>
        </div>
      `;
    } else {
      const c = data.complaint;
      row.innerHTML = `
        <div class="avatar">CA</div>
        <div class="result-card">
          <div class="result-title">✅ Logged as complaint #${c.complaint_id}</div>
          <dl class="result-grid">
            <dt>Category</dt><dd>${c.category ?? '—'}</dd>
            <dt>Issue</dt><dd>${c.issue ?? '—'}</dd>
            <dt>Priority</dt><dd><span class="priority-pill ${priorityClass(c.priority)}">${c.priority ?? '—'}</span></dd>
            <dt>Routed to</dt><dd>${c.department ?? '—'}</dd>
            <dt>Location</dt><dd>${c.location ?? 'Not detected'}</dd>
          </dl>
        </div>
      `;
    }

    thread.appendChild(row);
    scrollToBottom();
  }

  function addErrorMessage(message) {
    const row = document.createElement('div');
    row.className = 'msg-row system';
    row.innerHTML = `
      <div class="avatar">CA</div>
      <div class="bubble"><span class="error-note">${message}</span></div>
    `;
    thread.appendChild(row);
    scrollToBottom();
  }

  // Renders the classify-only preview as an editable draft the student
  // must confirm before anything is written to the database.
  function addDraftCard(description, data) {
  const row = document.createElement('div');
  row.className = 'msg-row system draft-row';

  if (data.is_restricted) {
    row.innerHTML = `
      <div class="avatar">CA</div>
      <div class="draft-card">
        <div class="draft-title">This looks like it should go to the confidential queue</div>
        <p class="restricted-note">
          It won't be shown on any public dashboard — only Student Affairs will see it.
        </p>
        <div class="draft-actions">
          <button class="btn-edit">Edit</button>
          <button class="btn-confirm">Confirm & send</button>
        </div>
      </div>
    `;
  } else {
    const loc = data.location;
    const needsLocation =
      loc && (loc.confidence === 'none' || loc.confidence === 'partial');

    row.innerHTML = `
      <div class="avatar">CA</div>
      <div class="draft-card">
        <div class="draft-title">
          Here's what I've got — take a look before I log it
        </div>

        <dl class="result-grid">
          <dt>Category</dt>
          <dd>${data.category ?? '—'}</dd>

          <dt>Issue</dt>
          <dd>${data.issue ?? '—'}</dd>

          <dt>Priority</dt>
          <dd>
            <span class="priority-pill ${priorityClass(data.priority)}">
              ${data.priority ?? '—'}
            </span>
          </dd>

          <dt>Routed to</dt>
          <dd>${data.department_hint ?? '—'}</dd>

          <dt>Location</dt>
          <dd>${locationSummary(loc)}</dd>
        </dl>

        ${needsLocation ? `
          <div class="location-ask">
            <p>
              ${
                loc.confidence === 'none'
                  ? "Where is this happening?"
                  : "I only caught part of the location — want to add more? (e.g. wing + floor, or a room code)"
              }
            </p>

            <div class="location-ask-row">
              <input
                type="text"
                class="location-input"
                placeholder="e.g. 1st floor, or CW204"
              />

              <button class="add-location-btn">Add</button>
            </div>
          </div>
        ` : ''}

        <div class="draft-actions">
          <button class="btn-edit">Edit</button>
          <button class="btn-confirm">Confirm & send</button>
        </div>
      </div>
    `;
  }

  thread.appendChild(row);
  scrollToBottom();

  row.querySelector('.btn-confirm').addEventListener(
    'click',
    () => handleConfirm(row)
  );

  row.querySelector('.btn-edit').addEventListener(
    'click',
    () => handleEditDraft(row)
  );

  const addLocationBtn = row.querySelector('.add-location-btn');

  if (addLocationBtn) {
    addLocationBtn.addEventListener(
      'click',
      () => handleAddLocation(row)
    );
  }
}

    
  

  function removeDraftCard(row) {
  if (row) row.remove();
}

  async function runClassify(description) {
    const response = await fetch(CLASSIFY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description })
    });
    if (!response.ok) throw new Error(`Server responded with ${response.status}`);
    return response.json();
  }

  async function handleSend() {
    const text = input.value.trim();
    if (!text) return;

    addStudentMessage(text);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    addTypingIndicator();
    pendingDescription = text;

    try {
      const data = await runClassify(text);

      removeTypingIndicator();

      if (data.redirect) {
          addErrorMessage(data.redirect_message);
      } else {
          addDraftCard(text, data);
      }
    } catch (err) {
      removeTypingIndicator();
      addErrorMessage(
        "Couldn't reach the server. Make sure your FastAPI backend is running at 127.0.0.1:8000, then try again."
      );
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // Student adds a location detail — appended to the description in their
  // own words, then re-classified, since the backend only extracts
  // location from description text (no separate location field).
  async function handleAddLocation(row) {
  const locInput = row.querySelector('.location-input');
  const extra = locInput.value.trim();

  if (!extra) return;

  addStudentMessage(extra);
  removeDraftCard(row);
  addTypingIndicator();

  pendingDescription = `${pendingDescription}. ${extra}`;

  try {
    const data = await runClassify(pendingDescription);

    removeTypingIndicator();
    addDraftCard(pendingDescription, data);

  } catch (err) {
    removeTypingIndicator();

    addErrorMessage(
      "Couldn't reach the server to re-check that. Try again in a moment."
    );
  }
}

  function handleEditDraft(row) {
  removeDraftCard(row);

  input.value = pendingDescription;
  pendingDescription = null;

  input.focus();

  input.style.height = 'auto';
  input.style.height =
    Math.min(input.scrollHeight, 120) + 'px';
}

  async function handleConfirm(row) {
  const confirmBtn = row.querySelector('.btn-confirm');
  const editBtn = row.querySelector('.btn-edit');

  confirmBtn.disabled = true;
  editBtn.disabled = true;
  confirmBtn.textContent = 'Logging...';

  try {
    const response = await fetch(SUBMIT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        description: pendingDescription
      })
    });

    if (!response.ok) {
      throw new Error(
        `Server responded with ${response.status}`
      );
    }

    const data = await response.json();

    removeDraftCard(row);
    addFinalResult(data);

  } catch (err) {
    confirmBtn.disabled = false;
    editBtn.disabled = false;
    confirmBtn.textContent = 'Confirm & send';

    addErrorMessage(
      "Couldn't submit — check the server is still running and try again."
    );

  } finally {
    pendingDescription = null;
  }
}

</script>

</body>
</html>
